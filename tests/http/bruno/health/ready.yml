info:
  name: Readiness
  type: http
  seq: 2
  tags:
    - phase-1
    - phase-12a
    - smoke

http:
  method: GET
  url: '{{baseUrl}}/health/ready'

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: '200'
    - expression: res.body.status
      operator: eq
      value: ok
    - expression: res.body.check
      operator: eq
      value: ready

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Confirma o readiness da Fase 12A. PostgreSQL e a fila de comandos SQS precisam
  estar alcançáveis; a stack visual não participa desta verificação.
