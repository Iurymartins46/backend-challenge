info:
  name: Readiness com query inválida
  type: http
  seq: 3
  tags:
    - phase-1
    - errors

http:
  method: GET
  url: '{{baseUrl}}/health/ready'
  params:
    - name: verbose
      value: invalid
      type: query

runtime:
  scripts:
    - type: tests
      code: |-
        test("retorna o envelope de erro uniforme", function() {
          expect(res.status).to.equal(400);
          expect(res.body.status).to.equal(400);
          expect(res.body.title).to.be.a("string");
          expect(res.body.detail).to.be.a("string");
          expect(res.body.traceId).to.be.a("string").and.not.be.empty;
          expect(res.body.errors).to.be.an("array").and.not.be.empty;
          expect(res.body.errors[0].code).to.match(/^error\./);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Exercita a validação Standard Schema/Zod e o contrato uniforme de erro.
