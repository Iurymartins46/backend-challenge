    - contract

http:
  method: GET
  url: '{{baseUrl}}/docs-json'
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("publica o contrato OpenAPI da Fase 1", function() {
          expect(res.status).to.equal(200);
          expect(res.body.openapi).to.match(/^3\./);
          expect(res.body.paths).to.have.property("/health/live");
          expect(res.body.paths).to.have.property("/health/ready");
        });

settings:
  encodeUrl: true

docs: |-
  Valida que a especificação OpenAPI está habilitada e contém as rotas atuais.
