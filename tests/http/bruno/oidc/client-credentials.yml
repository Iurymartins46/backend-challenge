info:
  name: Obter token client credentials
  type: http
  seq: 1
  tags:
    - phase-15
    - oidc

http:
  method: POST
  url: '{{oidcTokenUrl}}'
  auth:
    type: basic
    username: '{{oidcClientId}}'
    password: '{{oidcClientSecret}}'
  body:
    type: form-urlencoded
    data:
      - name: grant_type
        value: client_credentials

runtime:
  scripts:
    - type: tests
      code: |-
        test("obtém um access token de serviço", function() {
          expect(res.status).to.equal(200);
          expect(res.body.access_token).to.be.a("string").and.not.be.empty;
          expect(res.body.token_type).to.equal("Bearer");
        });
    - type: after-response
      code: |-
        bru.setVar("oidcAccessToken", res.body.access_token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Não versione o segredo do client. No demo local, use o secret público documentado no
  README apenas como secret local do Bruno; em ambiente compartilhado use credencial real.
