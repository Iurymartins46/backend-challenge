docs: |-
  Selecione o ambiente `oidc`, armazene `provider-a-secret` como secret local na variável
  `oidcClientSecret` e execute primeiro `Obter token client credentials`. O token é salvo
  em memória na variável `oidcAccessToken` e as rotas de wallet/wagering usam Bearer.
