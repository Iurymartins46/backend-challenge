name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:unit

      - name: Build
        run: bun run build

      - name: Package compatibility smoke test
        run: bun run smoke:packages

      - name: Scan tracked files for secrets
        run: bun run security:scan

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: wagering
          POSTGRES_USER: wagering
          POSTGRES_PASSWORD: wagering
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wagering -d wagering"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      localstack:
        image: localstack/localstack:4.14.0
        env:
          SERVICES: sqs
          AWS_DEFAULT_REGION: us-east-1
          DEBUG: 0
          PERSISTENCE: 0
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -fsS http://localhost:4566/_localstack/health | grep -q 'sqs'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://wagering:wagering@localhost:5432/wagering
      RUN_REAL_INTEGRATION_TESTS: 'true'
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT: http://127.0.0.1:4566
      SQS_COMMAND_QUEUE_NAME: wager-transactions.fifo
      SQS_COMMAND_DLQ_NAME: wager-transactions-dlq.fifo
      SQS_EVENTS_QUEUE_NAME: wager-events.fifo
      SQS_COMMAND_MAX_RECEIVE_COUNT: '5'

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Initialize LocalStack SQS queues
        env:
          AWS_ENDPOINT_URL: http://127.0.0.1:4566
        run: sh docker/localstack/init-queues.sh

      - name: Run PostgreSQL integration tests
        run: bun run test:integration
